<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kitty Night — Loading</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: transparent;
        user-select: none;
        font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      }

      .splash-wrap {
        width: 100%;
        height: 100%;
        padding: 10px;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .splash-card {
        width: 100%;
        background: #fbf8ff;
        border: 2px solid #2e1f47;
        box-shadow:
          0 8px 20px rgba(46, 31, 71, 0.24),
          inset 0 2px 0 #ffffff;
        color: #2e1f47;
      }

      .splash-header {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 8px 12px;
        background: #efe7fb;
        border-bottom: 2px solid #2e1f47;
      }

      .splash-avatar {
        width: 38px;
        height: 34px;
        background: #ffffff;
        border: 2px solid #2e1f47;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
      }

      .splash-avatar canvas {
        image-rendering: pixelated;
        display: block;
      }

      .splash-title-group {
        flex: 1;
        min-width: 0;
      }

      .splash-title {
        font-family: 'Cascadia Mono', Consolas, monospace;
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.06em;
        color: #2e1f47;
      }

      .splash-sub {
        font-size: 11px;
        color: #73608f;
      }

      .splash-badge {
        font-family: 'Cascadia Mono', Consolas, monospace;
        font-size: 10px;
        font-weight: 700;
        padding: 2px 6px;
        background: #ffffff;
        border: 1px solid #2e1f47;
        color: #2e1f47;
      }

      .splash-body {
        padding: 12px;
      }

      .splash-status-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        margin-bottom: 7px;
      }

      .splash-status {
        font-size: 12px;
        font-weight: 600;
        color: #2e1f47;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .splash-pct {
        font-family: 'Cascadia Mono', Consolas, monospace;
        font-variant-numeric: tabular-nums;
        font-size: 11px;
        font-weight: 700;
        color: #73608f;
        flex-shrink: 0;
      }

      .splash-track {
        width: 100%;
        height: 16px;
        background: #efe7fb;
        border: 2px solid #2e1f47;
        padding: 2px;
        overflow: hidden;
      }

      .splash-fill {
        width: 12%;
        height: 100%;
        background: #8d63d9;
        box-shadow: inset 0 2px 0 #b796f0;
        transition: width 160ms steps(8);
      }
    </style>
  </head>
  <body>
    <div class="splash-wrap">
      <div class="splash-card" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="12">
        <div class="splash-header">
          <div class="splash-avatar">
            <canvas id="kitten-loader-canvas" width="32" height="28"></canvas>
          </div>
          <div class="splash-title-group">
            <div class="splash-title">KITTY NIGHT</div>
            <div class="splash-sub">Desktop Companion</div>
          </div>
          <div class="splash-badge">LOADING</div>
        </div>
        <div class="splash-body">
          <div class="splash-status-row">
            <span id="splash-status" class="splash-status">Starting Kitty Night...</span>
            <span id="splash-pct" class="splash-pct">12%</span>
          </div>
          <div class="splash-track">
            <div id="splash-fill" class="splash-fill"></div>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/splash.ts"></script>
  </body>
</html>
